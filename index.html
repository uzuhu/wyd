<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>万屿达投料机</title>
<style>
  :root{--ink:#16232c;--sub:#6d7f8a;--line:#dde6eb;--p3:#2f8f5b;--p4:#2b6cb0;}
  *{box-sizing:border-box}
  body{margin:0;background:#f2f5f7;color:var(--ink);
    font:15px/1.6 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:22px 14px 40px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{font-size:13.5px;color:var(--sub);margin:0 0 16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:620px){ .grid{grid-template-columns:1fr} }
  .tool{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:18px 18px 14px;text-decoration:none;color:var(--ink);transition:.12s}
  .tool:hover{border-color:#9fc0d8;box-shadow:0 2px 8px rgba(22,35,44,.08);transform:translateY(-1px)}
  .ic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:19px;font-weight:700;margin-bottom:10px}
  .tool.a .ic{background:var(--p3)}
  .tool.b .ic{background:var(--p4)}
  .tool h2{font-size:17px;margin:0 0 6px}
  .tool p{font-size:13.5px;color:var(--sub);margin:0 0 12px;line-height:1.65}
  .go{font-size:14px;font-weight:700}
  .tool.a .go{color:var(--p3)}
  .tool.b .go{color:var(--p4)}
  .foot{margin-top:16px;font-size:12.5px;color:var(--sub)}
  .foot b{color:#42525c}
</style>
</head>
<body>
<div class="wrap">

<h1>万屿达投料机</h1>
<p class="sub">选一个工具进去</p>

<div class="grid">

  <a class="tool a" href="pipe.html">
    <div class="ic">管</div>
    <h2>管道用量与布置</h2>
    <p>按棚长、棚宽、喷头数量和管材，算出要几根管、几米 3 米 / 4 米管、几个接头，出 A4 横向下料单。</p>
    <div class="go">进入 →</div>
  </a>

  <a class="tool b" href="feed.html">
    <div class="ic">投</div>
    <h2>投料计算</h2>
    <p>按重量、时长、循环三个数码管的设定，算每次下料几秒；料投快了投慢了，反算重量该拧多少。</p>
    <div class="go">进入 →</div>
  </a>

</div>

<div class="foot">
  <b>投料计算</b>用到的下料速度固定按 17 克/秒（设备里的常数），现场饲料不一样时以实测为准。
</div>

</div>
</body>
</html>
